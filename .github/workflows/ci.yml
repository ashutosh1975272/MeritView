name: CI

on:
  push:
    branches: [main, develop, beta]
  pull_request:
    branches: [main]

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint || echo "Lint not configured"

  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  frontend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint || echo "Lint not configured"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm audit --audit-level=high || echo "Vulnerabilities found"
        working-directory: backend
      - run: pnpm audit --audit-level=high || echo "Vulnerabilities found"
        working-directory: frontend
